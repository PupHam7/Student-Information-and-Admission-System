<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Assessment</title>
<link rel="stylesheet" href="assessment.css">
</head>

<body>

  
<!-- ── Header ─────────────────────────────────────────────────────── -->
<header>
  <!-- Top bar: white with university logo + name -->
  <div class="header-top">
    <div class="header-seal">
      <img src="psu.png" alt="PSU Seal" />
    </div>
    <div class="header-university">Partido State University</div>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,500;0,700;1,300&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  </div>
  <!-- Gold nav bar: hamburger on the left -->
  <div class="header-nav">
    <div class="header-nav-hamburger" aria-label="Menu" onclick="toggleMenu()">
      <span></span><span></span><span></span>
    </div>
  
  </div>
</header>

<!-- CONTENT -->
<div id="assessment" class="tab-content">

  <div class="container">

    <!-- FILTERS -->
    <div class="filters">

      <!-- LEFT SIDE INFO -->
      <div class="left-info">
        <span>Name: <b id="First_name"></b></span>
        <span>Course & Year: <b id="courseYear"></b></span>
        <span>Dept: <b id="department"></b></span>
        <span>Sex: <b id="sex"></b></span>
        <span>Validated: <b id="validated"></b></span>
      </div>

      <!-- RIGHT SIDE BUTTON -->
      <button id="actionBtn" class="enroll-btn" onclick="handleEnroll()">Enroll</button>

    </div>

    <p id="enrollMessage" class="enroll-message"></p>

   <div class="subject-header">
  <p class="subtitle">Enrolled Subjects:</p>
  
  <div class="period-box">
    <label>Period:</label>
    <select id="period">
      <option>Loading...</option>
    </select>
  </div>
</div>

    
    <table>
      <thead>
        <tr>
          <th>Code</th>
          <th>Subject</th>
          <th>Description</th>
          <th>Units</
          <th>Schedule</th>
          <th>Instructor</th>
          <th>Section</th>
        </tr>
      </thead>

      <tbody id="scheduleTable"></tbody>

      <tfoot>
  <tr>
    <td></td>
    <td></td>
    <td style="text-align:right; font-weight:bold;">Total Units:</td>
    <td style="font-weight:bold; text-align:center;">
      <span id="totalUnits">0</span>
    </td>
    <td></td>
    <td></td>
    <td></td>
  </tr>
</tfoot>
    </table>

  </div> 

</div>

<!-- MODAL -->
<div id="modalOverlay" class="overlay hidden">
  <div class="modal">
    <p class="modal-text"><b>Are you sure you want to Enroll?</b><br>Click "Proceed" if yes.</p>

    <div class="modal-buttons">
      <button class="cancel-btn" onclick="goBack()">Cancel</button>
      <button class="proceed-btn" onclick="confirmEnroll()">Proceed</button>
    </div>
  </div>
</div>

<script src="assessment.js"></script>

</body>
</html>
