
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ParSU SIAS - Admin Portal</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Specific fixes to match Picture 1 */
        .admin-header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
        }
        .refresh-btn-styled {
            background-color: #2b5ab5;
            color: white;
            border: none;
            padding: 10px 40px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            width: 60%; /* Adjusting to match the wide button in your screenshot */
        }
        table { width: 90%; margin: 20px auto; border-collapse: collapse; background: white; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #003366; color: white; }
        .status-pending { color: orange; font-weight: bold; }
    </style>
</head>

<body class="page-bg">

<header>
  <div class="header-top">
    <div class="header-seal">
      <img src="psu.png" alt="PSU Seal" />
    </div>
    <div class="header-university">Partido State University</div>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,500;0,700;1,300&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  </div>
  <div class="header-nav">
    <div class="header-nav-hamburger" aria-label="Menu" onclick="toggleSidebar()">
      <span></span><span></span><span></span>
    </div>
  </div>
</header>

<div class="body">
    <aside class="sidebar" id="sidebar">
      <div class="profile">
        <div class="avatar">A</div>
        <div class="pid">Administrator</div>
        <div class="prole">System Office</div>
      </div>
      <nav>
        <button class="nav-item active" onclick="location.reload()">Admissions</button>
        <button class="nav-item" onclick="alert('Students coming soon')">Students</button>
        <button class="nav-item" onclick="alert('Instructors coming soon')">Instructors</button>
        <button class="nav-item logout" onclick="window.location.href='index.html'">Log Out</button>
      </nav>
    </aside>

    <main class="main">
      <div class="admin-header-flex">
        <h2 style="color: #003366; margin: 0;">Admissions Management</h2>
        <button onclick="loadPendingAdmissions()" class="refresh-btn-styled">Refresh List</button>
      </div>

      <div id="darkOverlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:99998;"></div>

      <table>
        <thead>
          <tr>
            <th>Admission ID</th>
            <th>Student Name</th>
            <th>Email</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="admissionTableBody">
          </tbody>
      </table>
    </main>
</div>

<script src="script.js"></script>
</body>
</html>

<div class="system-alerts-container">
    
    <div class="central-admin-controls">
    <h3 class="controls-title">Admin Control Panel</h3>

    <!-- System Announcement Toggle -->
    <div class="toggle-wrapper">
        <button class="toggle-header announcement-bg" onclick="toggleElement('announcementBox')">
            <span>📢 System Announcement</span>
            <span class="chevron" id="announcementBox-icon">▼</span>
        </button>
        <div id="announcementBox" class="toggle-content">
            <div class="content-inner">
                <textarea id="announcementInput" placeholder="Enter announcement text for students..."></textarea>
                <div class="action-row">
                    <button class="btn blue" onclick="postAlert('announcement')">Post Announcement</button>
                    <button class="btn-clear" onclick="clearInput('announcementInput')">Clear</button>
                </div>
            </div>
        </div>
    </div>

    <!-- System Confirmation Toggle -->
    <div class="toggle-wrapper">
        <button class="toggle-header confirmation-bg" onclick="toggleElement('confirmationBox')">
            <span>⚙️ System Update / Confirmation</span>
            <span class="chevron" id="confirmationBox-icon">▼</span>

        <div id="confirmationBox" class="toggle-content">
