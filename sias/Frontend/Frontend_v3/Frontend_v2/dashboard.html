<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ParSU SIAS Dashboard</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Google Fonts moved to Head for better performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,500;0,700;1,300&family=DM+Sans:wght@300;400;500;600&display=swap"
    rel="stylesheet" />
</head>

<body class="page-bg">

  <!-- ── Header ─────────────────────────────────────────────────────── -->
  <header class="main-header">
    <!-- Top bar: white with university logo + name -->
    <div class="header-top">
      <div class="header-seal">
        <img src="psu.png" alt="PSU Seal" />
      </div>
      <div class="header-university">Partido State University</div>
    </div>
    <!-- Gold nav bar: hamburger on the left -->
    <div class="header-nav">
      <div class="header-nav-hamburger" aria-label="Menu" onclick="toggleSidebar()">
        <span></span><span></span><span></span>
      </div>
      <div class="header-nav-label">Dashboard</div>
    </div>
  </header>

  <div class="body">
    <aside class="sidebar" id="sidebar">
      <div class="profile">
        <div class="avatar" id="avatar">?</div>
        <div class="pid" id="profileId">—</div>
        <div class="prole" id="profileRole">—</div>
      </div>
      <nav>
        <button class="nav-item" onclick="window.location.href='assessment.html'">Assessment/Enrollment</button>
        <button class="nav-item" onclick="window.location.href='coe.html'">View COE</button>
        <button class="nav-item" onclick="window.location.href='Scheduling.html'">My Schedule</button>
        <button class="nav-item" onclick="show('help', this)">Help</button>
        <button class="nav-item" onclick="show('support', this)">Support</button>
        <button class="nav-item" onclick="show('about', this)">About</button>
        <button class="nav-item logout" onclick="logout()">Log Out</button>
      </nav>
    </aside>

    <main class="main">
      <!-- Welcome Popup Overlay (Targeted by JS) -->
      <div id="welcomeOverlay" class="welcome-popup">
        <h2 style="margin-bottom: 15px;">
          Welcome back, <span id="welcomeName">Student</span>!
        </h2>
        <p style="margin-top: 10px;">
          Select a menu item from the sidebar to manage your enrollment.
        </p>
      </div>

      <!-- Main Home Section -->
      <div id="sec-home" class="sec active" style="padding: 20px;">
        <div id="sec-scheduling-inner" class="sec-content">
          <table id="dashScheduleTable" style="width:100%; border-collapse: collapse; margin-top: 15px;">
            <!-- Schedule content injected by script.js -->
          </table>
        </div>
      </div>

      <!-- Other Content Sections -->
      <div id="sec-admission" class="sec"></div>
      <div id="sec-enrollment" class="sec"></div>
      <div id="sec-help" class="sec"></div>
      <div id="sec-support" class="sec"></div>
      <div id="sec-about" class="sec"></div>
    </main>
  </div>

  <script src="script.js"></script>
</body>

</html>
