<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ParSU SIAS – Login</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body class="white-center-page">

 <!-- DARK BACKGROUND -->
<div id="darkOverlay" style="
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.7);
  z-index:9998;
"></div>

<!-- ERROR POPUP -->
<div id="errorPopup" style="
  display:none;
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%);
  background:#fff;
  border-left:6px solid red;
  padding:20px;
  width:280px;
  text-align:center;
  box-shadow:0 0 15px rgba(0,0,0,0.3);
  border-radius:8px;
  z-index:9999;
">
  <h3 style="color:red;">⚠ Login Error</h3>
  <p id="errorMessage">Error</p>

  <button onclick="closeError()"
    style="margin-top:10px; padding:6px 12px; background:red; color:white; border:none; border-radius:5px;">
    OK
  </button>
</div>
  </div>

  <div class="content-center">
    <img src="PSU_logo.png" class="seal" />
    <h2 class="uni-name">Partido State University</h2>
    <p class="uni-sub">Goa, Camarines, Sur</p>

    <span class="role-badge" id="roleBadge">Student</span>
    <a href="index.html" class="back-link">← Back to Selection</a>

    <form onsubmit="handleLogin(event)">
      <div class="field">
        <label>Student ID:</label>
        <input type="text" id="userId" placeholder="Enter your ID number" required />
      </div>

      <div class="field password-container">
        <label>Password:</label>
        <input type="password" id="password" placeholder="Enter your password" required />
        <span id="togglePassword">👁</span>
      </div>

      <button type="submit" class="btn blue">Login</button>

      <button type="button" class="btn gray"
        onclick="alert('Contact your administrator.')">
        Forgot Password
      </button>
    </form>
  </div>
  <script src="script.js"></script>
</body>
</html>
