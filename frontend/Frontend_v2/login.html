<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ParSU SIAS – Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="white-center-page">
  <div class="content-center">
    <img
      src="PSU_logo.png"
      class="seal"
    />
    <h2 class="uni-name">Partido State University</h2>
    <p class="uni-sub">Goa, Camarines, Sur</p>
    <span class="role-badge" id="roleBadge">Student</span>

    <a href="index.html" class="back-link">← Back to Selection</a>
    <form onsubmit="handleLogin(event)">
      <div class="field">
        <label id="idLabel">Student ID:</label>
        <input type="text" id="userId" placeholder="Enter your ID number" required />
      </div>
      <div class="field">
        <label>Password:</label>
        <input type="password" id="password" placeholder="Enter your password" required />
      </div>
      <button type="submit" class="btn blue">Login</button>
      <button type="button" class="btn gray"
        onclick="alert('Contact your administrator.')">Forgot Password</button>
    </form>
    
  </div>
  <script src="script.js"></script>
</body>
</html>
