<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ParSU SIAS - Admin Portal</title>
    <link rel="stylesheet" href="style.css">
    <style>
        table { width: 90%; margin: 20px auto; border-collapse: collapse; background: white; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #003366; color: white; }
        .status-pending { color: orange; font-weight: bold; }
        .approve-btn { background: green; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 3px; }
        .reject-btn { 
        background: #d9534f; /* Red */
        color: white; 
        border: none; 
        padding: 5px 10px; 
        cursor: pointer; 
        border-radius: 3px; 
        margin-left: 5px; 
        }
        .reject-btn:hover { background: #c9302c; }
    </style>
</head>
<!-- ERROR POPUP -->
<div id="errorPopup" style="
  display:none;
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%);
  background:#fff;
  border-left:6px solid red;
  padding:20px;
  width:280px;
  text-align:center;
  box-shadow:0 0 15px rgba(0,0,0,0.3);
  border-radius:8px;
  z-index:99999;
">
  <h3 style="color:red;">⚠ Error</h3>
  <p id="errorMessage">Something went wrong</p>
  <button onclick="document.getElementById('errorPopup').style.display='none'"
    style="
      margin-top:10px;
      padding:6px 12px;
      background:red;
      color:white;
      border:none;
      border-radius:5px;
      cursor:pointer;
    ">
    OK
  </button>
</div>

<body class="page-bg">
  <header class="header">
    <img src="PSU_logo.png" class="seal small" />
    <span class="uni-name">Partido State University</span>
  </header>

  <div class="gold-bar">
    <button class="menu-btn" onclick="toggleSidebar()">&#9776;</button>
  </div>

  <div class="body">
    <aside class="sidebar" id="sidebar">
      <div class="profile">
        <div class="avatar">A</div>
        <div class="pid">Administrator</div>
        <div class="prole">System Office</div>
      </div>
      <nav>
        <button class="nav-item active" onclick="location.reload()">Admissions</button>
        <button class="nav-item" onclick="alert('Manage Students coming soon')">Students</button>
        <button class="nav-item" onclick="alert('Manage Instructors coming soon')">Instructors</button>
        <button class="nav-item logout" onclick="window.location.href='index.html'">Log Out</button>
      </nav>
    </aside>

    <main class="main">
      <div class="header" style="text-align:center; padding:20px;">
        <h2 style="color: #003366;">Admissions Management</h2>
        <button onclick="loadPendingAdmissions()" class="btn blue">Refresh List</button>
      </div>
      <!-- DARK OVERLAY -->
<div id="darkOverlay" style="
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
  z-index:99998;
"></div>

<!-- POPUP MODAL -->
<div id="errorPopup" style="
  display:none;
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%);
  background:#fff;
  border-left:6px solid red;
  padding:20px;
  width:300px;
  text-align:center;
  box-shadow:0 0 15px rgba(0,0,0,0.3);
  border-radius:8px;
  z-index:99999;
">
  <h3 id="popupTitle" style="color:red;">⚠ Error</h3>
  <p id="errorMessage">Message</p>

  <button onclick="closePopup()"
    style="
      margin-top:10px;
      padding:6px 12px;
      background:red;
      color:white;
      border:none;
      border-radius:5px;
      cursor:pointer;
    ">
    OK
  </button>
</div>

      <table>
        <thead>
          <tr>
            <th>Admission ID</th>
            <th>Student Name</th>
            <th>Email</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="admissionTableBody">
          </tbody>
      </table>
    </main>
  </div>
  
  <script src="script.js"></script>
</body>
</html>
