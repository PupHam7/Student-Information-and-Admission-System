<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ParSU SIAS - Admin Portal</title>
    <link rel="stylesheet" href="style.css">
    <style>
        table { width: 90%; margin: 20px auto; border-collapse: collapse; background: white; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #003366; color: white; }
        .status-pending { color: orange; font-weight: bold; }
        .approve-btn { background: green; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 3px; }
        .reject-btn { 
        background: #d9534f; /* Red */
        color: white; 
        border: none; 
        padding: 5px 10px; 
        cursor: pointer; 
        border-radius: 3px; 
        margin-left: 5px; 
        }
        .reject-btn:hover { background: #c9302c; }
    </style>
</head>
<body class="page-bg">
  <header class="header">
    <img src="PSU_logo.png" class="seal small" />
    <span class="uni-name">Partido State University</span>
  </header>

  <div class="gold-bar">
    <button class="menu-btn" onclick="toggleSidebar()">&#9776;</button>
  </div>

  <div class="body">
    <aside class="sidebar" id="sidebar">
      <div class="profile">
        <div class="avatar">A</div>
        <div class="pid">Administrator</div>
        <div class="prole">System Office</div>
      </div>
      <nav>
        <button class="nav-item active" onclick="location.reload()">Admissions</button>
        <button class="nav-item" onclick="alert('Manage Students coming soon')">Students</button>
        <button class="nav-item" onclick="alert('Manage Instructors coming soon')">Instructors</button>
        <button class="nav-item logout" onclick="window.location.href='index.html'">Log Out</button>
      </nav>
    </aside>

    <main class="main">
      <div class="header" style="text-align:center; padding:20px;">
        <h2 style="color: #003366;">Admissions Management</h2>
        <button onclick="loadPendingAdmissions()" class="btn blue">Refresh List</button>
      </div>

      <table>
        <thead>
          <tr>
            <th>Admission ID</th>
            <th>Student Name</th>
            <th>Email</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="admissionTableBody">
          </tbody>
      </table>
    </main>
  </div>
  
  <script src="script.js"></script>
</body>
</html>
